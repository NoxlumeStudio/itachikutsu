    /* The visible part of Otatsu starts at seated head-height; her lower body goes behind the actual counter. */
    /* Cut the portrait itself along the countertop: its right edge is lower than its left. */
    .otatsu-sprite{position:absolute;z-index:1;left:39.75%;top:17%;width:21%;height:auto;overflow:hidden;pointer-events:none;transform:none;clip-path:polygon(0 0,100% 0,100% 86.85%,0 84.35%);filter:brightness(.72) saturate(.78)}
    .otatsu-sprite img{width:100%;height:auto;display:block}
    .parcel-sprite{position:absolute;z-index:2;left:56.8%;top:49.5%;width:14.5%;pointer-events:none;filter:brightness(.73) saturate(.83) drop-shadow(2px 7px 6px #080604cb)}
    .parcel-sprite img{display:block;width:100%;height:auto}
    /* Masaru stands behind the serving counter; the lower apron is clipped along its rear edge. */
    .masaru-sprite{position:absolute;z-index:1;left:32%;top:18%;width:28.6%;pointer-events:none;overflow:hidden;clip-path:polygon(0 0,100% 0,100% 71.4%,0 70.7%);filter:brightness(.74) saturate(.83)}
    .masaru-sprite img{display:block;width:100%;height:auto}
    .kamoshita-sprite{position:absolute;z-index:1;left:35.7%;top:16%;width:28.6%;pointer-events:none;filter:brightness(.74) saturate(.81) drop-shadow(0 7px 5px #0008)}
    .kamoshita-sprite img{display:block;width:100%;height:auto}

    .miko-sprite{position:absolute;z-index:1;left:35%;top:19%;width:30%;height:auto;pointer-events:none;filter:brightness(.77) saturate(.85) drop-shadow(1px 7px 8px #12050cbb)}
    .miko-sprite img{display:block;width:100%;height:auto}
    .yabu-sprite{position:absolute;z-index:1;left:47.5%;top:21%;width:31%;height:auto;pointer-events:none;filter:brightness(.79) saturate(.76) drop-shadow(1px 6px 8px #071017b8)}
    .yabu-sprite img{display:block;width:100%;height:auto}

    .akari-sprite{position:absolute;z-index:1;left:32%;top:24%;width:22%;height:auto;pointer-events:none;filter:brightness(.76) saturate(.78) drop-shadow(2px 5px 6px #030c11bd)}

  <div class="app" id="app">

  <script type="text/plain" id="legacy-game-source">
  (()=>{
    'use strict';
    const KEY='itachikutsu-prototype-v1';
    const blank=()=>({scene:'shop',quest:0,items:[],flags:{},visited:{},last:'',finished:false});
    let state=blank(), dialogue=[],dialogueEnd=null, speaker='',modal='title',paperSide='front';
    const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const scenes={shop:{title:'お辰の駄菓子屋',chapter:'第一幕',desc:'砂糖と油の匂いが、同じ棚から流れてくる。'},map:{title:'鼬窟 中央通路',chapter:'第二幕',desc:'雨水、提灯、配管の影。上にも下にも生活が続いている。'},stall:{title:'マサルの屋台',chapter:'第三幕',desc:'湯気の向こうで、鍋が小さく音を立てる。'},warehouse:{title:'鴨下の倉庫',chapter:'第四幕',desc:'焼けた金属と伝票の匂いが重なる。'},snack:{title:'路地裏のスナック',chapter:'街の寄り道',desc:'薄紅色の灯が、古い酒瓶と剥げた壁紙を染めていた。'},clinic:{title:'ヤブ先生の診療所',chapter:'窟の奥底',desc:'消毒液の下に、油と錆の臭いが沈んでいる。'},park:{title:'雨の小さな公園',chapter:'ふたりの時間',desc:'青白い灯の下に、ベンチがひとつ。少女は古いラジオを胸に抱いていた。'}};
    const H={
      shop:[['お辰','人物','✦',41,18,18.5,48,'tatsu'],['飴の瓶','調べる','◇',8,26,7.8,17,'candy'],['義指','調べる','⌁',77,71,9,9,'finger'],['火鉢','調べる','◉',74.5,49,11.5,16,'hibachi'],['ラムネ瓶','調べる','♧',27.4,44,3.7,20,'ramune'],['紙袋と伝票','仕事道具','▤',61,49.5,13.5,30,'parcel']],
      map:[['お辰の駄菓子屋','入る','燈',7,64,17,17,'go:shop'],['マサルの屋台','入る','湯',84,59,11,18,'go:stall'],['鴨下の倉庫','入る','庫',78,7,16,19,'go:warehouse'],['スナック（ミコ姐）','入る','灯',25.5,23.7,9,13,'go:snack'],['ヤブ先生のクリニック','入る','医',46,75,10,16,'go:clinic'],['小さな公園','入る','園',43,39,16,18,'go:park']],
      stall:[['マサル','人物','✦',34.5,18,26,54,'masaru'],['湯気の立つ大鍋','調べる','湯',16.5,38,19,24,'pot'],['醤油ラーメン','調べる','麺',56.5,62.5,16.5,17,'ramen'],['古いラジオ','調べる','◌',87.5,10,10.5,13,'radio']],
      warehouse:[['鴨下','人物','✦',37.5,16,25,76,'kamoshita'],['義眼','調べる','◉',21.5,68,9,11,'eye'],['再刻印装置','調べる','⚙',83.5,29,14,42,'stamp'],['都市地図','調べる','▧',3.5,7,16,42,'citymap'],['伝票台','調べる','▤',27.5,33,11.5,14,'ledger']],
      snack:[['化粧ポーチ','調べる','◇',10,46,10,15,'makeup'],['Re:naのポスター','調べる','♫',55,8,11,29,'rena'],['古いカラオケ機','調べる','♪',72,22,16,37,'karaoke'],['残されたグラス','調べる','◉',5.5,51,6,12,'glass'],['ミコ姐','人物','✦',39,22,17,71,'miko']],
      clinic:[['義体改造の料金表','調べる','▤',2.5,10,13,28,'clinicprice'],['古い手術台','調べる','◇',20,42,33,23,'surgerybed'],['展示された義足','調べる','⌁',89,18,9.5,48,'prostheticleg'],['診療記録の束','調べる','▧',15,56,10,8,'medicalnotes'],['ヤブ先生','人物','✦',52.5,24,22,70,'yabu']],
      park:[['青白い街灯','調べる','☼',65,3,21,16,'parklight'],['錆びたゴミ箱','調べる','◇',84,54,10,24,'parkbin'],['雨の水たまり','調べる','◌',63,78,19,15,'parkpuddle'],['暁里','人物','✦',34.5,27,18,51,'akari'],['古い携帯ラジオ','調べる','♫',43,44,7,10,'akariradio']]
    };
    const remarks={candy:'赤、青、緑。瓶の底で、飴玉が小さく光っている。\nこの店でいちばん鮮やかなものは、食べれば消えてしまう。',finger:'金属の指が一本、布の上に横たわっている。\n関節には細かな傷。誰かが何度も曲げ伸ばしした、その跡だけが残っていた。',hibachi:'炭が、ぱちりと鳴った。\n火が消えても、鉄の匂いは残る。',ramune:'瓶の口に薄い埃が積もっている。\n中のビー玉は、もう動かない。千夜は指で硝子を軽く弾いた。',wires:'一本の電線が火花を散らし、上階から怒鳴り声がした。\n「また誰か電気を盗ったろ！」\n数秒後、どこかでテレビの音が大きくなった。',poster:'「義手修理　現金のみ」\nその下には「迷い猫探してます」。\n猫の方が、義手より高い謝礼だった。',watcher:'上段の通路で、子供が空き缶を二度叩いた。\n奥の路地で扉が閉まる。\nこの街では、声より先に音が走る。',pot:'白い湯気が、狭い屋台を満たしている。\n油と醤油の匂いが、湿った空気を少しだけ温めた。',arm:'安物の義手が柄杓を握る。関節から、かすかな駆動音。\nマサルは手元を見もせず、鍋の火を調節した。',radio:'ざらざらとした雑音。遠い都市の放送が、ところどころ途切れて届く。\nこの街の誰も、天気予報を当てにはしない。',lantern:'色の抜けた提灯が、湯気の向こうで揺れている。\n赤い光は水たまりの上で何度も千切れた。',eye:'古びた義眼が布の上に転がっている。\nレンズの奥に、小さな傷。かつて何を見ていたのか、もう誰にも分からない。',stamp:'金属の表面に新しい番号が焼きつけられている。\n古い刻印は、その下に埋もれた。名前を変えれば、別のものになる。',citymap:'黒く塗り潰された区画がいくつもある。\n紙の上で消された場所にも、人は暮らしている。',ledger:'現金と手書き伝票が積まれている。\n記録の上では、金属は何度でも新しく生まれ変わる。'};
    const qdesc=['お辰に話しかける','鴨下の倉庫へ荷物を届ける','お辰の駄菓子屋へ戻る','一日の仕事が終わった'];
    remarks.ramen='湯気の中から、醤油の匂いが立ちのぼる。\n海苔は少し湿り、麺の端にはまだ熱が残っている。\nマサルは何も言わない。食え、と言う代わりに丼を置く男だった。';
    Object.assign(remarks,{makeup:'安物の口紅と、蓋のゆるい粉入れ。\n奥には爪先ほどの金属片が覗いている。誰かが身体の一部を飾りのように持ち歩く街だ。',rena:'擦り切れたポスターの女は、傷ひとつない顔で笑っている。\n外の街では、こんな光が毎晩灯るのだろうか。',karaoke:'厚いブラウン管の向こうで、湾岸の夜景が音もなくちらつく。\n選曲ボタンの文字は何度も押され、ところどころ消えていた。',glass:'口紅の色が、薄く縁に残っている。\n洗えば消えるものを、誰も急いで洗おうとしない。',backroom:'狭い通路の奥に、青い裸電球がひとつ。\nまだ誰かの足音は聞こえない。'});
    Object.assign(remarks,{clinicprice:'義足の交換、義眼の調整、端子の接続。\n値段の欄だけ、何度も数字が書き直されている。\n身体には値札がつく。だが、痛みにはつかない。',surgerybed:'革の留め具が、何人分もの体温を吸って黒ずんでいる。\n横たわる人間は毎回違うのに、天井の灯りだけは同じところを照らす。',prostheticleg:'白い義足が一本、棚の明かりを受けて立っている。\n膝の継ぎ目は滑らかだ。これで走れるとしたら、どこまで行けるだろう。',medicalnotes:'手書きの数字が並ぶ古い診療帳。名前のところは紙で覆われている。\n千夜は誰の記録か分からないまま、そっと帳面を閉じた。'});
    Object.assign(remarks,{parklight:'青白い蛍光灯が、雨粒をひとつずつ照らしている。\n空が見えない街にも、夜の明かりは必要らしい。',parkcage:'錆びた半球の遊具に、草が巻きついている。\n子供の声の代わりに、遠い配管が小さく鳴った。',parkpuddle:'濡れた舗装に、上の階の窓明かりが逆さに映る。\n千夜が足を動かすと、知らない空が波打った。',akariradio:'少女は古い携帯ラジオを胸に抱えている。\n雑音の向こうに、鼬窟ではない場所の声がかすかに混じった。'});
    remarks.parkbin='金網のゴミ箱は、内側から錆びていた。\n誰が捨てたのか分からない紙くずが、雨を吸って底に貼りついている。';
    const newPlaces={snack:'紫がかった闇の中に、桃色の灯がともっている。\n安い香水と古い歌の気配が、閉まった扉の向こうに残っていた。ミコ姐のいるスナックだ。\n――店内の探索と会話は、背景ができてから。',clinic:'白い灯は、夜更けの蛍光灯のように冷たい。\n義体を治すのか、身体を売るのか。奥の診療所に看板はない。\n――ヤブ先生の診療所は、まだ入口まで。',park:'違法増築の隙間に、小さな公園が残されている。\n錆びた柵、ひとつの街灯、風を待つベンチ。\nいつかここに、セーラー服の暁里が現れる。原作の出会いは、今はまだ始まらない。'};
    const put=id=>{if(!state.items.includes(id))state.items.push(id)};
    const lose=id=>{state.items=state.items.filter(x=>x!==id)};
    function render(){
      const s=scenes[state.scene];
      $('scene').className='scene '+state.scene;
      $('otatsuSprite').classList.toggle('hidden',state.scene!=='shop');
      $('shopCounterForeground').classList.toggle('hidden',state.scene!=='shop');
      $('parcelSprite').classList.toggle('hidden',state.scene!=='shop'||state.quest>0);
      $('masaruSprite').classList.toggle('hidden',state.scene!=='stall');
      $('kamoshitaSprite').classList.toggle('hidden',state.scene!=='warehouse');
      $('mikoSprite').classList.toggle('hidden',state.scene!=='snack');
      $('yabuSprite').classList.toggle('hidden',state.scene!=='clinic');
      $('akariSprite').classList.toggle('hidden',state.scene!=='park');
      $('sceneTitle').textContent=s.title;
      $('sceneStatus').textContent=['配達前','配達中','帰り道','仕事終わり'][state.quest];
      $('chapterText').textContent=s.desc;
      $('questShort').textContent=qdesc[state.quest];
      $('itemCount').textContent=state.items.length;
      $('hotspots').innerHTML='';
      const notes={map:'灯りのある場所をクリックして歩く',shop:'小物やお辰をクリックして調べる',stall:'マサル・鍋・ラーメン・ラジオをクリックして調べる',warehouse:'鴨下・地図・義眼・再刻印装置・伝票台をクリックして調べる',snack:'ミコ姐や化粧ポーチ・ポスターなどをクリックして調べる',clinic:'ヤブ先生・料金表・手術台・義足・診療記録をクリックして調べる',park:'暁里・ラジオ・街灯・ゴミ箱・水たまりをクリックして調べる'};
      document.querySelector('.scene-note').textContent=notes[state.scene]||'気になる場所をクリックして調べる';
      for(const [name,hint,symbol,x,y,w,h,key] of H[state.scene]){
        if(state.scene==='shop'&&key==='parcel'&&state.quest>0)continue;
        const b=document.createElement('button');
        const cls=state.scene==='map'?'map-entry':state.scene==='shop'?'shop-target':state.scene==='stall'?'stall-target':state.scene==='snack'?'snack-target':state.scene==='clinic'?'clinic-target':state.scene==='park'?'park-target':'warehouse-target';
        b.className='hotspot '+(key.startsWith('go:')?'destination':hint==='調べる'?'object':'')+' '+cls;
        b.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%;`;
        b.innerHTML=`<span class="symbol">${symbol}</span><span class="name">${esc(name)}</span><span class="hint">${esc(hint)}</span>`;
        b.setAttribute('aria-label',name+' '+hint);
        b.onclick=()=>act(key);
        $('hotspots').append(b);
      }
      $('mapBtn').disabled=state.scene==='map';
    }
    function show(text,who=''){speaker=who;$('speaker').textContent=who;$('line').textContent=text;$('choices').innerHTML='';$('nextBtn').textContent='次へ ▶';$('nextWrap').classList.toggle('hidden',!text)}
    function advanceText(){if(dialogue.length||dialogueEnd)nextLine();else show('')}
    function conversation(lines,onEnd){dialogue=lines.slice();dialogueEnd=onEnd;nextLine()}
    function nextLine(){if(!dialogue.length){const fn=dialogueEnd;dialogueEnd=null;if(fn)fn();render();return}const e=dialogue.shift();if(e.options){show(e.prompt||'',e.who||'');$('nextWrap').classList.add('hidden');e.options.forEach(opt=>{const b=document.createElement('button');b.className='choice';b.textContent=opt.text;b.onclick=()=>{state.flags.kamoChoice=opt.value;dialogue=opt.lines.concat(dialogue);nextLine()};$('choices').append(b)});}else{show(e.text,e.who||'');$('nextBtn').textContent='次へ ▶';$('nextWrap').classList.remove('hidden')}render()}
    const d=(who,text)=>({who,text});
    function act(key){if(modal||dialogue.length)return;if(key.startsWith('go:')){go(key.slice(3));return}if(key.startsWith('peek:')){const place=key.slice(5);state.visited[place]=true;show(newPlaces[place]||'');saveSilent();return}if(key==='tatsu'){if(state.quest===0)opening();else if(state.quest===2)closing();else show('お辰は義指を磨いている。\n「忘れ物かい？　鴨下が待ちくたびれるよ」','お辰');return}if(key==='parcel'){if(state.quest===0)show('菓子の袋に見えるが、中には冷たい金属が収まっている。\nお辰の話を聞いてから受け取ろう。');else show('もう預かった荷物だ。持ち物から伝票を調べられる。');return}if(key==='masaru'){masaru();return}if(key==='miko'){miko();return}if(key==='yabu'){yabu();return}if(key==='akari'){akari();return}if(key==='kamoshita'){if(state.quest===0)show('荷物を持っていない。お辰のもとへ戻ろう。');else if(state.quest===1)kamoshita();else show('鴨下はもう帳面へ目を戻している。');return}state.flags['look_'+key]=true;show(remarks[key]||'');saveSilent()}
    function miko(){
      if(state.flags.miko){show('ミコ姐は義指の先を親指で撫でた。\n「何よ。また来たの？　そんな顔して突っ立ってたら、お客に間違われるわよ」','ミコ姐');return}
      conversation([d('ミコ姐','あら、千夜じゃん。こんなとこまで来るなんて、迷子？'),d('千夜','迷子じゃねぇ。通りかかっただけだ'),d('ミコ姐','ふうん。……あんたってさ、嘘つくときも本当のこと言うときも、同じ顔すんのね'),d('地の文','ミコ姐は安物の義指を、爪の先でそっと撫でている。薄紅色の灯が、剥げかけた金属を濡らしていた。'),d('千夜','それ、壊れてんのか'),d('ミコ姐','壊れてんのは、あたしの方かもね。……冗談よ。そういう顔すんなって'),d('ミコ姐','お辰の婆ちゃんによろしく。あの人の小言、たまに聞きたくなるのよ。聞いたら聞いたで腹立つんだけどさ')],()=>{state.flags.miko=true;show('ミコ姐は笑って、また義指に目を戻した。');saveSilent()});

    function yabu(){

    function akari(){

    function go(s){if(!scenes[s]||dialogue.length)return;state.scene=s;state.visited[s]=true;render();show(scenes[s].desc);saveSilent()}

    function opening(){conversation([d('地の文','鼬窟の朝は、陽が昇るより先に始まる。\nお辰の駄菓子屋には、砂糖と油の匂いが満ちていた。'),d('お辰','おや。今日はずいぶんと早いじゃないか'),d('千夜','いつもと同じだろ'),d('お辰','年寄りにはね、昨日と同じ朝なんて一つもないんだよ。……ちゃんと寝たのかい'),d('千夜','寝た'),d('お辰','嘘おっしゃい。寝た人間の目じゃないよ'),d('千夜','婆さんだって寝てねぇだろ'),d('お辰','あたしゃいいんだよ。もう寝てる時間の方が長くなる歳なんだから'),d('地の文','お辰は義指の関節に油を差し、二度曲げ伸ばしした。'),d('お辰','昔はね、新しい義手をつけた客が嬉しそうに手を振って帰ったもんさ。今は古い手を売って飯を食う。ずいぶん器用な世の中になったね'),d('お辰','さて、あんたにも働いてもらおうか。鴨下の倉庫までこいつを持っていきな'),d('千夜','またあいつか'),d('お辰','嫌ならあたしが行くよ。この老いぼれにあの階段を上り下りさせる気かい'),d('千夜','……分かったよ'),d('お辰','伝票は表と裏を間違えるんじゃないよ。分かってるって言う奴ほど、ろくに見ちゃいないんだ'),d('地の文','お辰は紙袋と伝票、それに飴玉を千夜の掌へ押しつけた。'),d('千夜','子供じゃねぇぞ'),d('お辰','知ってるよ。だから一個しかやらないんじゃないか'),d('お辰','……鴨下が余計なことを言っても、真に受けるんじゃないよ')],()=>{state.quest=1;['parcel','slip','candy'].forEach(put);show('紙袋、伝票、飴玉を受け取った。\n依頼：鴨下の倉庫へ荷物を届ける。');saveSilent()})}
    function masaru(){if(state.flags.masaru){show('マサルは鍋の火を確かめ、顎だけで挨拶した。\n「……伸びる前に食えよ」','マサル');return}conversation([d('マサル','……なんだ。お前か'),d('千夜','客に言う台詞かよ'),d('マサル','客なら座れ。醤油しかねえぞ'),d('千夜','いつもだろ'),d('マサル','嫌ならよそ行け'),d('千夜','嫌とは言ってねぇ'),d('地の文','マサルは安物の義手で柄杓を握った。関節が小さく引っかかる。'),d('千夜','……腕、調子悪いのか'),d('マサル','ちゃんと動いてる。こいつにも飯を食わせてやりてえよ。油ばっかり飲みやがって'),d('千夜','婆さんに直してもらえよ'),d('マサル','直しに行ったら、まず説教だろ'),d('千夜','……そうだな'),d('マサル','婆さんの使いか。鴨下んとこだろ'),d('千夜','なんで分かる'),d('マサル','その袋、見飽きた。……あいつは昔から、甘いものなんか食わねえくせに菓子の包みが好きなんだ'),d('地の文','丼がひとつ、千夜の前に置かれた。'),d('千夜','頼んでねぇぞ。金もねぇ'),d('マサル','知ってる。余りもんだ。……伸びるぞ'),d('千夜','……うまいな'),d('マサル','当たり前だ。何年作ってると思ってやがる'),d('マサル','……鴨下には気をつけろよ'),d('千夜','婆さんにも言われた'),d('マサル','あの婆さんが一番、奴のことを知ってる'),d('千夜','昔、何かあったのか'),d('マサル','……麺が伸びるぞ')],()=>{state.flags.masaru=true;show('湯気の向こうで、マサルはもう鍋を見ていた。');saveSilent()})}
    function kamoshita(){conversation([d('地の文','再刻印装置が低く唸っている。\n鴨下は扇子で首筋をあおぎながら、伝票をめくっていた。'),d('鴨下','おやおや。お辰のところの千夜ちゃんじゃないか'),d('千夜','荷物だ'),d('鴨下','挨拶くらいしなさいよ。商売ってのはね、最初の一言で半分決まるんだから'),d('千夜','あたしは商売してねぇ'),d('鴨下','だから君は賢いんだよ'),d('地の文','鴨下は紙袋を受け取り、掌の上で軽く揺らした。'),d('鴨下','昔はね、新品の義手に保証書までつけて売ってたもんさ。今じゃ保証書の方が高く売れる'),d('千夜','くだらねぇ'),d('鴨下','くだらないことに金を払うのが人間なんだよ。夢とか、肩書とか、名前とかね'),{prompt:'鴨下「……ところで君、戸籍はどうなってる？」',options:[{text:'黙っている',value:'silent',lines:[d('鴨下','沈黙は金になる。覚えとくといいよ')]},{text:'「仕事には関係ねぇだろ」',value:'work',lines:[d('千夜','仕事には関係ねぇだろ'),d('鴨下','そうさ。関係ない方が都合のいい仕事もある')]},{text:'鴨下を見返す',value:'stare',lines:[d('地の文','千夜は鴨下の目を見返した。'),d('鴨下','おっかない目だねぇ。婆さんに似てきたよ')]}]},d('地の文','鴨下は受領印を押し、伝票を返した。'),d('鴨下','婆さんに伝えといてよ。上物の件、今週中に頼むって'),d('千夜','……ああ'),d('鴨下','あの人も変わらないね。昔から、捨てるってことを知らない'),d('鴨下','もっとも、何でも拾ってりゃ、いつか自分の手が塞がっちまう'),d('千夜','……あたしのことか'),d('鴨下','さあね。君は何だと思う？')],()=>{lose('parcel');lose('slip');put('receipt');state.quest=2;show('荷物を届けた。\n受領済みの伝票を受け取った。お辰に報告しよう。');saveSilent()})}
    function closing(){conversation([d('地の文','店に戻ると、お辰はまだ義指を磨いていた。火鉢の炭は少し小さくなっている。'),d('お辰','おや。帰ったのかい'),d('千夜','……ああ'),d('お辰','鴨下は？'),d('千夜','いつもどおり'),d('お辰','そりゃ結構。あの男がいつもどおりじゃなくなったら、この街もおしまいだ'),d('千夜','今週中に上物をまとめろって'),d('お辰','……言うと思ったよ'),d('千夜','断りゃいいだろ'),d('お辰','断れるもんなら、とっくに断ってるさ'),d('お辰','昔はね、あいつだってもう少しましな顔で笑ってたんだ'),d('千夜','今も笑ってるだろ'),d('お辰','ああ。笑い方だけは上手くなったね'),d('お辰','人間、長く生きりゃ賢くなると思ってたけどね。ずるくなる方が早いらしい'),d('千夜','婆さんもか'),d('お辰','あたしは生まれつきさ'),...(state.flags.masaru?[d('地の文','千夜の胸に、屋台の湯気が一瞬戻った。黙って置かれた丼の温度が、まだ指先に残っている気がした。')]:[]),...(state.flags.look_eye?[d('地の文','倉庫の義眼には細かな傷があった。お辰の磨く義指にも、同じように誰かの時間が残っている。')]:[]),...(state.flags.look_stamp?[d('地の文','倉庫では古い刻印が新しい数字に覆われていた。布で磨かれたこの指には、消えない傷がある。')]:[]),d('お辰','ほれ、そこに座りな。仕事はもう終わりだよ'),d('千夜','まだ昼だぞ'),d('お辰','年寄りにゃ、昼も夜も同じさ。明日が来りゃ、また働くんだから'),d('地の文','外ではまた雨が降り始めていた。\n誰かが何かを壊し、誰かがそれを直している。\n千夜はポケットの飴を指で転がした。まだ、少し硬かった。\n――鼬窟は、今日も息をしている。')],()=>{state.quest=3;state.finished=true;saveSilent();endScreen()})}
    function itemsModal(){const labels={parcel:['義体部品入りの紙袋','駄菓子に偽装された荷物。鴨下へ届ける。'],slip:['折り畳まれた伝票','表は菓子、裏には義体部品の記載がある。'],candy:['飴玉','お辰に押しつけられた、色の抜けた飴。'],receipt:['受領済みの伝票','朱印が押された薄い紙。仕事は終わった。']};const marks={parcel:'▣',slip:'▤',candy:'◉',receipt:'▧'};let html='<div class="journal-head"><span class="journal-emblem" aria-hidden="true">▣</span><div><p class="journal-kicker">CHIYA / INVENTORY</p><h2>持ち物</h2></div></div><div class="itemlist">';for(const id of state.items){const a=labels[id];html+=`<button class="item" data-item="${id}"><span class="item-token" aria-hidden="true">${marks[id]||'◇'}</span>${esc(a[0])}<span>${esc(a[1])}</span></button>`}html+='</div>'+(state.items.length?'<p>品物を選ぶと、手に取って調べられる。</p>':'<p>ポケットには、まだ何も入っていない。</p>');openPanel(html);document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>itemDetail(b.dataset.item))}
    function itemDetail(id){const data={parcel:'「ベビーカステラ」と印刷された紙袋。中で金属がかすかに鳴る。',slip:'表には菓子の納品書がある。',candy:'お辰が持たせた飴玉。包み紙の端が少し破れている。',receipt:'倉庫で押された朱印。紙の裏には薄い油染みがある。'};if(id==='slip'){paperSide='front';paperModal();return}openPanel(`<h2>品物を調べる</h2><p>${esc(data[id]||'')}</p><div class="panel-actions"><button class="actionbtn" id="backItems">持ち物へ戻る</button></div>`);$('backItems').onclick=itemsModal}
    function paperModal(){state.flags.look_slip=true;const front=paperSide==='front';openPanel(`<h2>折り畳まれた伝票</h2><div class="paper"><small>${front?'表面｜駄菓子納品書':'裏面｜部品受渡票'}</small><br><strong>${front?'菓子類 納品控':'義体部品 内訳'}</strong><hr>${front?'ベビーカステラ　１包<br>飴玉　雑品扱い<br>納入先：先の倉庫':'義眼外周<br>脳端子カバー<br>未処理チップ　0.7単位'}</div><p>${front?'紙には砂糖の匂いが残る。':'細い文字で品名と数字が並ぶ。飴の袋は、別のものを運んでいた。'}</p><div class="panel-actions"><button class="actionbtn primary" id="flipPaper">裏返す</button><button class="actionbtn" id="backItems">持ち物へ戻る</button></div>`);$('flipPaper').textContent=front?'裏返す':'表へ戻す';$('flipPaper').onclick=()=>{paperSide=front?'back':'front';paperModal()};$('backItems').onclick=itemsModal;saveSilent()}
    function questModal(){const done=state.quest===3;openPanel(`<div class="journal-head"><span class="journal-emblem" aria-hidden="true">▤</span><div><p class="journal-kicker">HANDWRITTEN RECORD</p><h2>依頼帳</h2></div></div><p class="eyebrow">今日の仕事</p><h3>鴨下の倉庫へ荷物を届ける</h3><p>${esc(qdesc[state.quest])}</p><div class="journal-status">受注：${state.quest>=1?'済':'未'}　／　届け物：${state.quest>=2?'完了':'未完了'}　／　報告：${done?'完了':'未完了'}</div><p>この街には、手書きの伝票と人の口約束がまだ残っている。</p>`)}
    function menu(){openPanel(`<h2>メニュー</h2><p>『鼬窟 ― 千夜のある一日 ―』試作版。<br>人物・場所・物品を直接クリックして探索する短編です。</p><div class="panel-actions"><button class="actionbtn" id="menuSave">現在の進行を保存</button><button class="actionbtn" id="menuLoad">保存から再開</button><button class="actionbtn" id="menuReset">最初からやり直す</button></div><p class="eyebrow">仮背景は後から制作画像に交換できます。</p>`);$('menuSave').onclick=()=>{save();menu()};$('menuLoad').onclick=loadGame;$('menuReset').onclick=()=>confirmReset()}
    function confirmReset(){openPanel('<h2>最初からやり直す</h2><p>現在の進行状況が失われます。よろしいですか？</p><div class="panel-actions"><button class="actionbtn primary" id="resetYes">最初から</button><button class="actionbtn" id="resetNo">やめる</button></div>');$('resetYes').onclick=()=>{state=blank();dialogue=[];localStorage.removeItem(KEY);closePanel();render();show('戸の隙間から、油と雨の匂いが流れ込む。\n奥では、お辰が義指を磨いていた。');};$('resetNo').onclick=menu}
    function openPanel(inner){modal='open';$('overlay').classList.remove('hidden','title-screen');$('modalContent').innerHTML=`<button class="smallbtn modalclose" id="closeModal">閉じる ×</button>${inner}`;$('closeModal').onclick=closePanel}
    function closePanel(){modal='';$('overlay').classList.add('hidden');$('overlay').classList.remove('title-screen')}
    function saveSilent(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
    function save(){saveSilent();openPanel('<div class="journal-head"><span class="journal-emblem" aria-hidden="true">◇</span><div><p class="journal-kicker">RECORD SAVED</p><h2>記録を残した</h2></div></div><p>千夜が歩いた道と、この街で交わした言葉を記録した。</p><div class="journal-status">保存先：このブラウザの中</div><p>次に開いたとき、タイトル画面の「続きから」で再開できる。</p>')}
    function loadGame(){try{const s=JSON.parse(localStorage.getItem(KEY));if(!s||!scenes[s.scene]||!Array.isArray(s.items))throw Error();state={...blank(),...s,flags:s.flags||{},visited:s.visited||{}};dialogue=[];closePanel();render();show('保存したところから再開した。')}catch(e){openPanel('<h2>保存データなし</h2><p>このブラウザには読み込める記録がありません。</p>')}}
    function endScreen(){openPanel('<p class="eyebrow">完了｜千夜のある一日</p><h2 class="endtitle">――鼬窟は、今日も息をしている。</h2><p>今日の配達が終わった。\n明日もきっと、荷物がある。</p><div class="panel-actions"><button class="actionbtn primary" id="endReturn">街をもう少し歩く</button><button class="actionbtn" id="endRestart">はじめから</button></div>');$('endReturn').onclick=()=>{closePanel();go('map')};$('endRestart').onclick=confirmReset}
    function title(){
      const hasSave=!!localStorage.getItem(KEY);
      openPanel(`<div class="title-layout"><div class="title-kicker">2D EXPLORATION ADVENTURE</div><span class="title-rule"></span><h1 class="title-main">鼬窟</h1><div class="title-reading">いたちくつ</div><div class="title-sub">千夜のある一日</div><p class="title-copy">地上都市から切り捨てられた、雨と油煙の街。<br>ここでは、誰もが何かを隠して暮らしている。<br>今日も千夜は、ひとつの荷物を運ぶ。</p><div class="title-actions"><button class="actionbtn primary" id="newStart">▶　はじめる</button>${hasSave?'<button class="actionbtn" id="continue">続きから</button>':''}</div></div><div class="title-footnote">鼬窟 ― 千夜のある一日 ―　/　探索アドベンチャー試作版</div>`);
      $('overlay').classList.add('title-screen');
      $('newStart').onclick=()=>{state=blank();closePanel();render();show('戸の隙間から、油と雨の匂いが流れ込む。\n奥では、お辰が義指を磨いていた。');};
      if(hasSave)$('continue').onclick=loadGame;
    }
    $('nextBtn').onclick=advanceText;$('line').onclick=()=>{if(!$('nextWrap').classList.contains('hidden'))advanceText()};$('speaker').onclick=()=>{if(!$('nextWrap').classList.contains('hidden'))advanceText()};$('mapBtn').onclick=returnToMap;$('itemsBtn').onclick=itemsModal;$('questBtn').onclick=questModal;$('saveBtn').onclick=save;
    render();show('');title();
  })();
  </script>

  <script>
    (()=>{
      const header=document.querySelector('.topbar');
      if(!header)return;
      const navigation=header.querySelector('.actions');
      if(navigation){
        navigation.id='mainNavigation';
        const toggle=document.createElement('button');
        toggle.type='button';
        toggle.className='nav-toggle';
        toggle.textContent='☰ メニュー';
        toggle.setAttribute('aria-controls','mainNavigation');
        toggle.setAttribute('aria-expanded','false');
        header.insertBefore(toggle,navigation);
        const close=()=>{
          header.classList.remove('menu-open');
          toggle.setAttribute('aria-expanded','false');
        };
        toggle.addEventListener('click',()=>{
          const open=header.classList.toggle('menu-open');
          toggle.setAttribute('aria-expanded',String(open));
        });
        navigation.addEventListener('click',event=>{
          if(event.target.closest('button'))close();
        });
        document.addEventListener('pointerdown',event=>{
          if(!header.contains(event.target))close();
        });
        document.addEventListener('keydown',event=>{
          if(event.key==='Escape'&&header.classList.contains('menu-open')){close();toggle.focus();}
        });
        window.addEventListener('resize',()=>{
          if(window.matchMedia('(min-width:1101px)').matches)close();
        },{passive:true});
      }
      const syncHeader=()=>document.documentElement.style.setProperty(
        '--responsive-header-bottom',`${Math.ceil(header.getBoundingClientRect().bottom)}px`);
      syncHeader();
      if(typeof ResizeObserver==='function')new ResizeObserver(syncHeader).observe(header);
      window.addEventListener('resize',syncHeader,{passive:true});
    })();
  </script>
